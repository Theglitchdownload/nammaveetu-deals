name: Update Nammaveetu Basket Daily Deals Feed

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-deals-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Deal Fetcher Script
        run: node fetch_deals.js

      - name: Commit and Push Updated Deals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add home_feed.json
          git diff --staged --quiet || (git commit -m "Auto-update Malligai & Kitchen deals" && git push)
