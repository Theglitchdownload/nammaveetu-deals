name: Update Nammaveetu Basket Daily Deals Feed

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-deals-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and wrap latest Indian deals
        env:
          AMZ_ASSOC_TAG: ${{ secrets.AMZ_ASSOC_TAG || 'nammaveetubas-21' }}
          CUELINKS_PUB_ID: ${{ secrets.CUELINKS_PUB_ID || 'YOUR_PUB_ID' }}
        run: node deals-backend/fetch_deals.js

      - name: Commit and push updated home_feed.json
        run: |
          git config user.name "nammaveetu-deals-bot"
          git config user.email "deals-bot@nammaveetu.com"
          git add deals-backend/home_feed.json
          git diff --staged --quiet || git commit -m "chore(deals): auto-update home_feed.json [skip ci]"
          git push
